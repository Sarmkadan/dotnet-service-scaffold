name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dotnet-service-scaffold.sln

      - name: Build
        run: dotnet build --no-restore -c Release dotnet-service-scaffold.sln

      - name: Test
        run: dotnet test --no-build -c Release dotnet-service-scaffold.sln --logger trx
